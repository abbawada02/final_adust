{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Login - ADUST CS PGMS{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card p-4">
      <div class="text-center mb-3">
        <i class="bi bi-mortarboard-fill fs-1 text-dark"></i>
        <h4 class="mt-2 fw-bold">ADUST CS Postgraduate Portal</h4>
        <p class="text-muted small">Sign in to your account</p>
      </div>
      {% crispy form %}
      <hr>
      <div class="text-center small">
        <a href="{% url 'accounts:student_register' %}">Register as Student</a> &nbsp;|&nbsp;
        <a href="{% url 'accounts:lecturer_register' %}">Register as Lecturer</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
