{% extends "base.html" %}
{% block title %}Account Locked{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <i class="bi bi-shield-lock-fill display-1 text-danger"></i>
    <h3 class="mt-3">Account Temporarily Locked</h3>
    <p class="text-muted">Too many failed login attempts. Your account has been locked for 1 hour. Please try again later or contact the administrator.</p>
  </div>
</div>
{% endblock %}
