{% extends "base.html" %}
{% block title %}Pending Approval{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <i class="bi bi-hourglass-split display-1 text-warning"></i>
    <h3 class="mt-3">Registration Pending Approval</h3>
    <p class="text-muted">Your registration has been received and is awaiting approval from the PG Coordinator. You will be notified by email once approved.</p>
    <a href="{% url 'accounts:logout' %}" class="btn btn-outline-secondary mt-3">Sign Out</a>
  </div>
</div>
{% endblock %}
