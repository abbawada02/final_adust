{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Lecturer Registration - ADUST CS PGMS{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-8">
    <div class="card p-4">
      <h4 class="fw-bold mb-1"><i class="bi bi-person-badge me-2"></i>Lecturer Registration</h4>
      <p class="text-muted small mb-3">Register your lecturer account. Activation is subject to admin approval.</p>
      {% crispy form %}
      <p class="text-center small mt-2"><a href="{% url 'accounts:login' %}">Back to Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
